on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pandiff pr
    steps:
      - name: Hello world
        id: hello
        uses: carafelix/simple-pandiff-action@3b0d79c069093f7ed968e175965491c581c6ad16

      # Use the output from the `hello` step
      - name: Get the output time
        run: echo "${{ steps.hello.outputs.diffs }}" | jq .
