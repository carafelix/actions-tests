on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pandiff pr
    steps:
      - name: Hello world action step
        id: hello
        uses: carafelix/pandiff-action@c198dc8a9b25d7a53408266bf5dbdc76864fe84c
        with:
          repo-token: ${{github.GH_TOKEN}}
      # Use the output from the `hello` step
      - name: Get the output time
        run: echo "${{ steps.hello.outputs.diffs }}"
