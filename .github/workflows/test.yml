on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pandiff pr
    steps:
      - name: Hello world
        id: hello
        uses: carafelix/simple-pandiff-action@1ab41458d0b83054c3238c4c841c8b001dbede83

      # Use the output from the `hello` step
      - name: Get the output time
        run: echo '${{ steps.hello.outputs.diffs }}' | jq .
