on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pandiff pr
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Hello world action step
        id: hello
        uses: carafelix/simple-pandiff-action@c91aa002b3353c1a60d4216933aa49a7e148d0b9
        with:
          repo-token: ${{secrets.GH_API_TOKEN}}
      # Use the output from the `hello` step
      - name: Get the output time
        run: echo "${{ steps.hello.outputs.diffs }}"
