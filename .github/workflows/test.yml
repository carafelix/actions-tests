on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pandiff pr
    steps:
      - name: Hello world action step
        id: hello
        uses: carafelix/simple-pandiff-action@f32ba8bb3082ff8fa284e1c4f9b41d6dbd116218
        with:
          repo-token: ${{secrets.GH_TOKEN}}
      # Use the output from the `hello` step
      - name: Get the output time
        run: echo "${{ steps.hello.outputs.diffs }}"
