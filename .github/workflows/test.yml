on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pandiff pr
    steps:
      - name: Hello world action step
        id: hello
        uses: carafelix/simple-pandiff-action@432e22284b359ada68d19dec7d92a1aff99fc181
        with:
          repo-token: ${{secrets.GH_TOKEN}}
      # Use the output from the `hello` step
      - name: Get the output time
        run: echo "${{ steps.hello.outputs.diffs }}"
