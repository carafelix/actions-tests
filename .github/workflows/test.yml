on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pandiff pr
    steps:
      - name: Hello world
        id: hello
        uses: carafelix/simple-pandiff-action@6b44f05d271d8fe013cc08ae131981b8fe7b3957

      # Use the output from the `hello` step
      - name: Get the output time
        run: echo "${{ steps.hello.outputs.diffs }}" | jq .
