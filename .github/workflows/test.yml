on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pandiff pr
    steps:
      - name: Hello world
        id: hello
        uses: carafelix/simple-pandiff-action@e7bbe756f6916ea125b0bf357ece5f7995b11cc0

      # Use the output from the `hello` step
      - name: Get the output time
        run: echo "${{ steps.hello.outputs.diffs }}" | jq .
