on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pandiff pr
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Hello world action step
        id: hello
        uses: carafelix/simple-pandiff-action@74694290faeeff2a9628e6cf22e15e1b9f6e95e4
        with:
          repo-token: ${{secrets.GH_API_TOKEN}}
      # Use the output from the `hello` step
      - name: Get the output time
        run: echo "${{ steps.hello.outputs.diffs }}"
