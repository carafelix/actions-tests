on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pandiff pr
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Hello world action step
        id: hello
        uses: carafelix/pandiff-action@fdddf27f77df06be68d998d2918140288a24edf5
        with:
          repo-token: ${{secrets.GH_API_TOKEN}}
      # Use the output from the `hello` step
      - name: Get the output time
        run: echo "${{ steps.hello.outputs.diffs }}"
